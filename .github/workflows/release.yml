# Publishes a release with a macOS zip and a Windows zip.
# Start it from the Actions tab (Run workflow, with a version such as v1.0.0),
# or push a tag that starts with v.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, for example v1.0.0"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "tag=${INPUT_VERSION:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build the zips
        run: scripts/make_release.sh "${{ steps.version.outputs.tag }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.zip \
            --title "GPO Fishing Macro $TAG" \
            --notes-file .github/release-notes.md \
            --target "$GITHUB_SHA"
